{% extends "indicateurs/base.html" %}
{% block contenu %}
    <h1>Configurer une collecte</h1>

    {% if message %}
        <p style="color: green;">{{ message }}</p>
    {% endif %}
    {% if erreur %}
        <p style="color: red;">Erreur : {{ erreur }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Collecter maintenant</button>
    </form>
{% endblock %}
